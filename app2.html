<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משיכת נתוני מניות היסטוריים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* הגדרת גופן בסיסי למראה נקי */
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl p-8 border border-slate-200">
        
        <h1 class="text-3xl font-bold text-slate-800 mb-6 text-center">לוח בקרה פיננסי</h1>
        <p class="text-slate-500 mb-8 text-center">הורד נתונים היסטוריים של מניות כקובץ CSV או ייצא ישירות ל-Google Sheets.</p>

        <form id="financeForm" class="space-y-6">
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label for="ticker" class="block text-sm font-medium text-slate-700 mb-2">סימול מניה (Ticker)</label>
                    <input type="text" id="ticker" name="ticker" placeholder="לדוגמה: AAPL" required
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all dir-ltr text-left uppercase">
                </div>

                <div>
                    <label for="startDate" class="block text-sm font-medium text-slate-700 mb-2">תאריך התחלה</label>
                    <input type="date" id="startDate" name="startDate" required
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                </div>

                <div>
                    <label for="endDate" class="block text-sm font-medium text-slate-700 mb-2">תאריך סיום</label>
                    <input type="date" id="endDate" name="endDate" required
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-4 pt-4">
                <button type="button" id="btnCsv" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg shadow transition-colors flex justify-center items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    הורד כ-CSV
                </button>
                <button type="button" id="btnSheet" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-6 rounded-lg shadow transition-colors flex justify-center items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    צור גיליון Google Sheets
                </button>
            </div>
        </form>

        <div id="loadingIndicator" class="hidden mt-8 flex flex-col items-center justify-center space-y-3">
            <svg class="animate-spin h-8 w-8 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="text-slate-600 font-medium text-lg">מעבד נתונים, אנא המתן...</span>
        </div>

        <div id="resultContainer" class="hidden mt-8"></div>

    </div>

    <script>
        // כתובת ה-API של Google Apps Script
        const API_URL = "https://script.google.com/macros/s/AKfycbxH_ciaRv67DkxkKyn2LWpW1yw-Dq79ft1DMXa4ybQ42VKhLnvacN8MICcueDZIIncu2w/exec";

        // אלמנטים מה-DOM
        const tickerInput = document.getElementById('ticker');
        const startDateInput = document.getElementById('startDate');
        const endDateInput = document.getElementById('endDate');
        const btnCsv = document.getElementById('btnCsv');
        const btnSheet = document.getElementById('btnSheet');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const resultContainer = document.getElementById('resultContainer');
        const form = document.getElementById('financeForm');

        // מניעת שליחת טופס רגילה
        form.addEventListener('submit', (e) => e.preventDefault());

        // מאזינים לכפתורים המעבירים את סוג הפעולה המבוקשת
        btnCsv.addEventListener('click', () => processRequest('csv'));
        btnSheet.addEventListener('click', () => processRequest('sheet'));

        /**
         * הפונקציה המרכזית המעבדת את הבקשה
         * @param {string} actionType - 'csv' או 'sheet'
         */
        async function processRequest(actionType) {
            // וידוא שהשדות מלאים (HTML5 Validation API)
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const ticker = tickerInput.value.trim().toUpperCase();
            const startDate = startDateInput.value;
            const endDate = endDateInput.value;

            // בניית אובייקט ה-JSON שיישלח לשרת
            const payload = {
                ticker: ticker,
                startDate: startDate,
                endDate: endDate,
                action: actionType
            };

            // איפוס ממשק: הצגת טעינה והסתרת תוצאות קודמות
            resultContainer.innerHTML = '';
            resultContainer.classList.add('hidden');
            loadingIndicator.classList.remove('hidden');
            
            // השבתת הכפתורים בזמן הטעינה
            btnCsv.disabled = true;
            btnSheet.disabled = true;
            btnCsv.classList.add('opacity-50', 'cursor-not-allowed');
            btnSheet.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                // ביצוע בקשת POST
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8', // שימוש ב-text/plain כדי למנוע בעיות CORS של Preflight ב-GAS
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`שגיאת רשת: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();

                // טיפול בתשובה מהשרת
                if (data.status === 'success') {
                    if (actionType === 'csv' && data.csvData) {
                        handleCsvSuccess(ticker, data.csvData);
                    } else if (actionType === 'sheet' && data.sheetUrl) {
                        handleSheetSuccess(data.sheetUrl);
                    } else {
                        showError("התקבלה תשובה חסרה מהשרת.");
                    }
                } else {
                    // השרת החזיר שגיאה לוגית
                    showError(data.message || "שגיאה לא ידועה התרחשה בשרת.");
                }

            } catch (error) {
                // תפיסת שגיאות רשת או קוד
                showError(error.toString());
            } finally {
                // הסתרת אנימציית טעינה והחזרת הכפתורים לפעולה
                loadingIndicator.classList.add('hidden');
                btnCsv.disabled = false;
                btnSheet.disabled = false;
                btnCsv.classList.remove('opacity-50', 'cursor-not-allowed');
                btnSheet.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        /**
         * טיפול בהצלחה של הורדת CSV
         */
        function handleCsvSuccess(ticker, csvText) {
            // 1. יצירת קובץ להורדה מיידית (Blob)
            const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `${ticker}_data.csv`;
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            // 2. יצירת טבלת תצוגה מקדימה (5 שורות ראשונות)
            const lines = csvText.trim().split('\n');
            let tableHtml = `
                <div class="p-6 bg-green-50 border border-green-200 rounded-lg mb-6">
                    <p class="text-green-800 font-bold text-lg mb-1 flex items-center gap-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        קובץ ה-CSV ירד בהצלחה!
                    </p>
                    <p class="text-green-700 text-sm">ההורדה החלה באופן אוטומטי בדפדפן שלך.</p>
                </div>
                <h3 class="text-lg font-bold text-slate-700 mb-3">תצוגה מקדימה (עד 5 שורות):</h3>
                <div class="overflow-x-auto rounded-lg border border-slate-200 shadow-sm dir-ltr">
                    <table class="min-w-full divide-y divide-slate-200 text-sm text-left">
            `;

            for (let i = 0; i < Math.min(5, lines.length); i++) {
                if (!lines[i]) continue;
                
                // פיצול פשוט לפי פסיקים (הנחה שאין פסיקים בתוך המירכאות בהתבסס על נתוני Yahoo)
                const cells = lines[i].split(',');
                
                if (i === 0) {
                    // שורת כותרת
                    tableHtml += '<thead class="bg-slate-100"><tr>';
                    cells.forEach(cell => {
                        tableHtml += `<th class="px-4 py-3 font-semibold text-slate-600 uppercase tracking-wider">${cell.replace(/"/g, '')}</th>`;
                    });
                    tableHtml += '</tr></thead><tbody class="bg-white divide-y divide-slate-200">';
                } else {
                    // שורות נתונים
                    tableHtml += '<tr class="hover:bg-slate-50 transition-colors">';
                    cells.forEach(cell => {
                        tableHtml += `<td class="px-4 py-3 text-slate-700 whitespace-nowrap">${cell.replace(/"/g, '')}</td>`;
                    });
                    tableHtml += '</tr>';
                }
            }
            
            tableHtml += '</tbody></table></div>';
            
            // הזרקת ה-HTML לאזור התוצאות
            resultContainer.innerHTML = tableHtml;
            resultContainer.classList.remove('hidden');
        }

        /**
         * טיפול בהצלחה של יצירת גיליון בגוגל שיטס
         */
        function handleSheetSuccess(sheetUrl) {
            const successHtml = `
                <div class="p-6 bg-green-100 border border-green-400 text-green-800 rounded-lg shadow-md text-center">
                    <svg class="w-16 h-16 mx-auto mb-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <h3 class="text-2xl font-bold mb-2">הגיליון נוצר בהצלחה!</h3>
                    <p class="mb-6 text-green-700">הנתונים יובאו בהצלחה לגיליון גוגל חדש בחשבון שלך.</p>
                    <a href="${sheetUrl}" target="_blank" rel="noopener noreferrer" class="inline-block bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-transform transform hover:scale-105">
                        פתח את הגיליון כעת
                    </a>
                </div>
            `;
            resultContainer.innerHTML = successHtml;
            resultContainer.classList.remove('hidden');
        }

        /**
         * הצגת שגיאות בצורה יפה למשתמש
         */
        function showError(errorMessage) {
            const errorHtml = `
                <div class="p-5 bg-red-50 border-r-4 border-red-500 rounded-l-lg shadow-sm">
                    <div class="flex items-center gap-3 mb-2">
                        <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <h3 class="text-lg font-bold text-red-800">שגיאה בתהליך</h3>
                    </div>
                    <p class="text-red-700 ml-9 font-mono text-sm break-words" dir="ltr">${errorMessage}</p>
                </div>
            `;
            resultContainer.innerHTML = errorHtml;
            resultContainer.classList.remove('hidden');
        }
    </script>
</body>
</html>
