<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>דשבורד פיננסי מקצועי</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&display=swap');
        body { font-family: 'Heebo', sans-serif; }
        /* Premium custom scrollbar for the table */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-900 min-h-screen p-4 md:p-8 text-slate-800 antialiased flex flex-col items-center">

    <div class="w-full max-w-5xl bg-white/90 backdrop-blur-xl shadow-2xl rounded-3xl p-6 md:p-10 border border-white/20">
        
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-700 to-indigo-600 mb-3">
                שליפת נתונים פיננסיים
            </h1>
            <p class="text-slate-500 font-medium text-lg">מערכת מתקדמת לייצוא נתוני מניות היסטוריים</p>
        </div>

        <form id="dataForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            
            <div class="flex flex-col">
                <label for="tickers" class="text-sm font-bold text-slate-700 mb-2">סימולי מניות (Tickers)</label>
                <input type="text" id="tickers" required placeholder="לדוגמה: AAPL, MSFT, TSLA" 
                    class="px-4 py-3 rounded-xl border border-slate-200 bg-white/50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none dir-ltr text-left font-mono">
            </div>

            <div class="flex flex-col">
                <label for="startDate" class="text-sm font-bold text-slate-700 mb-2">תאריך התחלה</label>
                <input type="date" id="startDate" required 
                    class="px-4 py-3 rounded-xl border border-slate-200 bg-white/50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none">
            </div>

            <div class="flex flex-col">
                <label for="endDate" class="text-sm font-bold text-slate-700 mb-2">תאריך סיום</label>
                <input type="date" id="endDate" required 
                    class="px-4 py-3 rounded-xl border border-slate-200 bg-white/50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none">
            </div>

            <div class="flex flex-col">
                <label for="frequency" class="text-sm font-bold text-slate-700 mb-2">תדירות</label>
                <select id="frequency" required 
                    class="px-4 py-3 rounded-xl border border-slate-200 bg-white/50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none appearance-none">
                    <option value="daily">יומי (Daily)</option>
                    <option value="weekly">שבועי (Weekly)</option>
                    <option value="monthly">חודשי (Monthly)</option>
                </select>
            </div>
        </form>

        <div class="flex justify-center mb-8">
            <button type="submit" form="dataForm" id="loadBtn" 
                class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3 px-12 rounded-full shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5 text-lg flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                טען נתונים
            </button>
        </div>

        <div id="errorContainer" class="hidden mb-6 p-4 bg-red-50 border-r-4 border-red-500 text-red-800 rounded-l-xl shadow-sm"></div>
        
        <div id="loadingSpinner" class="hidden flex-col items-center justify-center py-8">
            <svg class="animate-spin h-10 w-10 text-indigo-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <span id="loadingText" class="text-indigo-800 font-semibold text-lg">מעבד נתונים, אנא המתן...</span>
        </div>

        <div id="previewContainer" class="hidden animate-fade-in-up">
            </div>

        <div id="exportActions" class="hidden mt-8 pt-6 border-t border-slate-200">
            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <button type="button" id="btnCsv" class="flex-1 max-w-xs bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 px-6 rounded-xl shadow-md transition-all flex justify-center items-center gap-2">
                    <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    הורד כ-CSV
                </button>
                <button type="button" id="btnSheet" class="flex-1 max-w-xs bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 px-6 rounded-xl shadow-md transition-all flex justify-center items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    ייצא ל-Google Sheets
                </button>
            </div>
        </div>

    </div>

    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.5s ease-out forwards; }
    </style>

    <script>
        // אזהרה: ודאו שהכתובת תואמת ל-Deployment האחרון בגוגל!
        const API_URL = "https://script.google.com/macros/s/AKfycbxH_ciaRv67DkxkKyn2LWpW1yw-Dq79ft1DMXa4ybQ42VKhLnvacN8MICcueDZIIncu2w/exec";
        
        let globalCsvData = "";

        const dataForm = document.getElementById('dataForm');
        const loadBtn = document.getElementById('loadBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const loadingText = document.getElementById('loadingText');
        const previewContainer = document.getElementById('previewContainer');
        const exportActions = document.getElementById('exportActions');
        const errorContainer = document.getElementById('errorContainer');
        const btnCsv = document.getElementById('btnCsv');
        const btnSheet = document.getElementById('btnSheet');

        function showError(msg) {
            errorContainer.innerHTML = `<p class="font-bold">שגיאה בתהליך:</p><p class="text-sm mt-1 dir-ltr text-left font-mono">${msg}</p>`;
            errorContainer.classList.remove('hidden');
        }

        function hideMessages() {
            errorContainer.classList.add('hidden');
            loadingSpinner.classList.add('hidden');
        }

        // ==========================================
        // STEP 1: LOAD DATA & PREVIEW
        // ==========================================
        dataForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // איפוס ממשק
            hideMessages();
            previewContainer.innerHTML = "";
            previewContainer.classList.add('hidden');
            exportActions.classList.add('hidden');
            globalCsvData = "";

            // --- PAYLOAD קריטי: שמות המשתנים פה חייבים להיות זהים לחלוטין למה שהשרת מצפה ---
            const payload = {
                tickers: document.getElementById('tickers').value,
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value,
                frequency: document.getElementById('frequency').value,
                action: 'csv' // הפעולה הראשונית היא רק לשלוף את הנתונים אלינו כטקסט
            };

            // הצגת טעינה ונעילת כפתור
            loadingText.innerText = "שולף נתונים מהשרת, אנא המתן...";
            loadingSpinner.classList.remove('hidden');
            loadBtn.disabled = true;
            loadBtn.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                // עקיפת CORS מתבצעת על ידי שליחת Content-Type מסוג text/plain בלבד!
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error(`Network response was not ok: ${response.status}`);
                
                const data = await response.json();

                if (data.status === 'success' && data.csvData) {
                    globalCsvData = data.csvData;
                    buildPreviewTable(globalCsvData);
                } else {
                    throw new Error(data.message || "שגיאה לא ידועה התקבלה מהשרת");
                }

            } catch (error) {
                showError(error.toString());
            } finally {
                loadingSpinner.classList.add('hidden');
                loadBtn.disabled = false;
                loadBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });

        function buildPreviewTable(csvText) {
            const lines = csvText.trim().split('\n');
            const maxRows = Math.min(6, lines.length); // כותרת + 5 שורות נתונים
            
            let html = `
                <div class="mb-4 flex items-center justify-between">
                    <h2 class="text-xl font-bold text-slate-800">תצוגה מקדימה של הנתונים</h2>
                    <span class="text-xs font-semibold bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full border border-emerald-200">
                        הנתונים נשלפו בהצלחה!
                    </span>
                </div>
                <div class="overflow-x-auto custom-scrollbar rounded-xl border border-slate-200 shadow-inner bg-white">
                    <table class="min-w-full divide-y divide-slate-200 text-sm dir-ltr">
            `;

            for (let i = 0; i < maxRows; i++) {
                if (!lines[i]) continue;
                
                // פיצול בסיסי לפי פסיקים (הנחה שאין פסיקים פנימיים בנתוני פיננסים סטנדרטיים)
                const cells = lines[i].split(',');
                
                if (i === 0) {
                    html += '<thead class="bg-slate-50"><tr>';
                    cells.forEach(cell => {
                        html += `<th class="px-6 py-4 font-bold text-slate-600 text-left uppercase tracking-wider">${cell.replace(/"/g, '')}</th>`;
                    });
                    html += '</tr></thead><tbody class="bg-white divide-y divide-slate-100">';
                } else {
                    html += '<tr class="hover:bg-indigo-50 transition-colors">';
                    cells.forEach(cell => {
                        html += `<td class="px-6 py-4 text-slate-700 font-mono whitespace-nowrap">${cell.replace(/"/g, '')}</td>`;
                    });
                    html += '</tr>';
                }
            }
            
            html += '</tbody></table></div>';
            if (lines.length > 6) {
                html += `<p class="text-center text-sm text-slate-500 mt-3 font-medium">+ עוד ${lines.length - 6} שורות זמינות בייצוא המלא</p>`;
            }

            previewContainer.innerHTML = html;
            previewContainer.classList.remove('hidden');
            exportActions.classList.remove('hidden');
        }

        // ==========================================
        // STEP 2: EXPORT ACTIONS
        // ==========================================
        
        // יצירת קובץ CSV באופן מקומי (ללא פנייה נוספת לשרת!)
        btnCsv.addEventListener('click', () => {
            if (!globalCsvData) return;
            const blob = new Blob([globalCsvData], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `financial_data_${new Date().toISOString().slice(0,10)}.csv`;
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // פנייה שנייה לשרת ליצירת גיליון בגוגל דרייב
        btnSheet.addEventListener('click', async () => {
            hideMessages();
            exportActions.classList.add('hidden'); // הסתרת הכפתורים
            loadingText.innerText = "מייצר גיליון Google Sheets, אנא המתן...";
            loadingSpinner.classList.remove('hidden');

            const payload = {
                tickers: document.getElementById('tickers').value,
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value,
                frequency: document.getElementById('frequency').value,
                action: 'sheet' // הפעם אנו מבקשים מהשרת לייצר גיליון
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error(`Network response was not ok: ${response.status}`);
                const data = await response.json();

                if (data.status === 'success' && data.sheetUrl) {
                    // הצגת כרטיס הצלחה ירוק וגדול
                    exportActions.innerHTML = `
                        <div class="bg-gradient-to-r from-emerald-500 to-teal-600 rounded-2xl p-8 text-center shadow-lg text-white animate-fade-in-up">
                            <svg class="w-16 h-16 mx-auto mb-4 text-white opacity-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <h3 class="text-3xl font-bold mb-2">הגיליון נוצר בהצלחה!</h3>
                            <p class="mb-6 opacity-90 text-lg">כל הנתונים שוחזרו וסודרו בגיליון בחשבון ה-Google שלך.</p>
                            <a href="${data.sheetUrl}" target="_blank" class="inline-block bg-white text-emerald-700 font-extrabold py-3 px-10 rounded-full shadow-lg hover:shadow-xl hover:scale-105 transition-all transform text-lg">
                                פתח את הגיליון כעת
                            </a>
                        </div>
                    `;
                } else {
                    throw new Error(data.message || "שגיאה ביצירת הגיליון");
                }

            } catch (error) {
                showError(error.toString());
            } finally {
                loadingSpinner.classList.add('hidden');
                exportActions.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
